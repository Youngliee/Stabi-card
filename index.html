<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stabi Builder</title>
<style>
:root{--bg:#071514;--panel:#0d2422;--panel2:#12332f;--text:#f3fffd;--muted:#a6c8c4;--accent:#79f7d4;--accent2:#c7ff6b;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at top,#123a34 0,#071514 42%);color:var(--text);min-height:100vh}
.app{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--accent),#2ca88f);display:grid;place-items:center;color:#06201b;font-weight:900;box-shadow:0 8px 30px rgba(121,247,212,.25)}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}.badge{padding:8px 12px;border:1px solid var(--border);border-radius:999px;color:var(--accent);font-size:12px;background:rgba(255,255,255,.04)}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.card{background:rgba(10,28,26,.9);border:1px solid var(--border);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.preview{padding:18px}.canvasWrap{border-radius:18px;overflow:hidden;aspect-ratio:1/1;background:#173f39;position:relative}.canvasWrap canvas{width:100%;height:100%;display:block}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}.btn{border:none;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer;background:#173b36;color:var(--text);border:1px solid var(--border)}.btn.primary{background:var(--accent);color:#06211b}.btn.secondary{background:var(--accent2);color:#1b2607}.btn:hover{transform:translateY(-1px)}
.controls{padding:18px}.section{padding:14px 0;border-bottom:1px solid var(--border)}.section:last-child{border-bottom:none}.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 11px;border-radius:12px;border:1px solid var(--border);background:#102c29;color:var(--text);cursor:pointer;font-size:13px}.chip.active{outline:2px solid var(--accent);background:#153a35}.swatch{width:34px;height:34px;border-radius:10px;border:2px solid transparent;cursor:pointer}.swatch.active{border-color:white;box-shadow:0 0 0 2px var(--accent)}input{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--border);background:#0b211e;color:white;outline:none}input:focus{border-color:var(--accent)}.footer{color:var(--muted);font-size:12px;text-align:center;margin:18px 0 4px}
@media(max-width:860px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.badge{display:none}.actions{grid-template-columns:1fr}.app{padding:14px}.card{border-radius:18px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo">S</div><div><h1>Stabi Builder</h1><div class="sub">Create your Stabi. Join the community.</div></div></div>
    <div class="badge">COMMUNITY LAB · V1</div>
  </div>
  <div class="grid">
    <div class="card preview">
      <div class="canvasWrap"><canvas id="avatar" width="1080" height="1080"></canvas></div>
      <div class="actions">
        <button class="btn" id="randomBtn">🎲 Randomize</button>
        <button class="btn secondary" id="transparentBtn">◫ Transparent PNG</button>
        <button class="btn primary" id="downloadBtn">↓ Export Card</button>
      </div>
    </div>
    <div class="card controls">
      <div class="section"><div class="label">Nickname</div><input id="nickname" maxlength="18" value="STABI #0042" /></div>
      <div class="section"><div class="label">Body Color</div><div class="row" id="colors"></div></div>
      <div class="section"><div class="label">Expression</div><div class="row" id="expressions"></div></div>
      <div class="section"><div class="label">Headwear</div><div class="row" id="headwear"></div></div>
      <div class="section"><div class="label">Accessory</div><div class="row" id="accessories"></div></div>
      <div class="section"><div class="label">Role Badge</div><div class="row" id="roles"></div></div>
      <div class="section"><div class="label">Background</div><div class="row" id="backgrounds"></div></div>
    </div>
  </div>
  <div class="footer">Fan-made community prototype · Replace the placeholder mascot layers with official Stabi art later.</div>
</div>
<script>
const canvas=document.getElementById('avatar'),ctx=canvas.getContext('2d');
const state={color:'#79f7d4',expression:'Happy',headwear:'None',accessory:'Shield',role:'Stabilitician',bg:'Deep Teal',nickname:'STABI #0042'};
const colors=['#79f7d4','#7cc8ff','#c795ff','#ffd56f','#ff8fa3','#e7ff8a'];
const expressions=['Happy','Cool','Focused','Sleepy'];
const headwear=['None','Cap','Halo','Cyber'];
const accessories=['None','Shield','Sword','USDZ','Laptop'];
const roles=['Community','Beta Tester','Stabilitician','Stabiligner','StabiliInsight'];
const bgs={'Deep Teal':['#0f3f38','#081e1b'],'Mint Grid':['#9af7d9','#0b342c'],'Night':['#12162c','#050711'],'Sunset':['#ffb66b','#5d275e']};
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=8;ctx.stroke()}}
function draw(transparent=false){ctx.clearRect(0,0,1080,1080);if(!transparent){let g=ctx.createLinearGradient(0,0,1080,1080);let bg=bgs[state.bg];g.addColorStop(0,bg[0]);g.addColorStop(1,bg[1]);ctx.fillStyle=g;ctx.fillRect(0,0,1080,1080);ctx.globalAlpha=.12;for(let i=0;i<18;i++){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(540,500,120+i*26,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1}
ctx.globalAlpha=.22;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(540,860,240,48,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
ctx.fillStyle=state.color;ctx.strokeStyle='#082824';ctx.lineWidth=18;ctx.beginPath();ctx.roundRect(340,270,400,500,150);ctx.fill();ctx.stroke();
rounded(300,390,85,210,42,state.color,'#082824');rounded(695,390,85,210,42,state.color,'#082824');
rounded(390,350,300,205,74,'#082824');
ctx.fillStyle='#eafffb';if(state.expression==='Sleepy'){ctx.lineWidth=14;ctx.strokeStyle='#eafffb';ctx.beginPath();ctx.moveTo(440,445);ctx.lineTo(500,445);ctx.moveTo(580,445);ctx.lineTo(640,445);ctx.stroke()}else{ctx.beginPath();ctx.arc(475,430,26,0,Math.PI*2);ctx.arc(605,430,26,0,Math.PI*2);ctx.fill();if(state.expression==='Cool'){ctx.fillStyle='#082824';ctx.fillRect(430,410,90,34);ctx.fillRect(560,410,90,34)}}
ctx.strokeStyle='#eafffb';ctx.lineWidth=13;ctx.lineCap='round';ctx.beginPath();if(state.expression==='Focused'){ctx.moveTo(480,505);ctx.lineTo(600,505)}else{ctx.arc(540,485,58,.15*Math.PI,.85*Math.PI)}ctx.stroke();
rounded(390,720,105,150,45,state.color,'#082824');rounded(585,720,105,150,45,state.color,'#082824');
ctx.fillStyle='#082824';ctx.font='900 82px system-ui';ctx.textAlign='center';ctx.fillText('S',540,680);
if(state.headwear==='Cap'){ctx.fillStyle='#0c2925';ctx.beginPath();ctx.arc(535,300,140,Math.PI,Math.PI*2);ctx.fill();rounded(525,275,190,42,20,'#0c2925')}if(state.headwear==='Halo'){ctx.strokeStyle='#e7ff8a';ctx.lineWidth=18;ctx.beginPath();ctx.ellipse(540,245,150,40,0,0,Math.PI*2);ctx.stroke()}if(state.headwear==='Cyber'){ctx.strokeStyle='#7cc8ff';ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(390,335);ctx.lineTo(340,265);ctx.lineTo(405,285);ctx.moveTo(690,335);ctx.lineTo(745,265);ctx.lineTo(675,285);ctx.stroke()}
if(state.accessory==='Shield'){ctx.fillStyle='#c8fff1';ctx.strokeStyle='#082824';ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(770,560);ctx.lineTo(930,610);ctx.lineTo(900,770);ctx.lineTo(850,830);ctx.lineTo(800,770);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#0f6053';ctx.font='900 54px system-ui';ctx.fillText('0%',850,705)}
if(state.accessory==='Sword'){ctx.strokeStyle='#dffff5';ctx.lineWidth=28;ctx.beginPath();ctx.moveTo(810,780);ctx.lineTo(940,430);ctx.stroke();ctx.strokeStyle='#082824';ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(780,720);ctx.lineTo(875,760);ctx.stroke()}
if(state.accessory==='USDZ'){ctx.fillStyle='#fff';ctx.strokeStyle='#082824';ctx.lineWidth=15;ctx.beginPath();ctx.arc(850,680,92,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#0e6758';ctx.font='900 52px system-ui';ctx.fillText('USDZ',850,697)}
if(state.accessory==='Laptop'){rounded(760,620,220,140,22,'#d8f7f0','#082824');ctx.fillStyle='#0e6758';ctx.font='900 54px system-ui';ctx.fillText('S',870,710)}
rounded(80,75,330,82,34,'rgba(5,25,22,.72)','rgba(255,255,255,.18)');ctx.fillStyle='#bfffee';ctx.font='700 28px system-ui';ctx.textAlign='left';ctx.fillText(state.role.toUpperCase(),115,126);
if(!transparent){ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 64px system-ui';ctx.fillText(state.nickname||'STABI',540,960);ctx.fillStyle='rgba(255,255,255,.72)';ctx.font='600 25px system-ui';ctx.fillText('CREATE YOUR STABI · COMMUNITY EDITION',540,1005)}
}
function makeChips(id,items,key){const el=document.getElementById(id);items.forEach(v=>{let b=document.createElement('button');b.className='chip'+(state[key]===v?' active':'');b.textContent=v;b.onclick=()=>{state[key]=v;[...el.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()};el.appendChild(b)})}
const ce=document.getElementById('colors');colors.forEach(v=>{let b=document.createElement('button');b.className='swatch'+(state.color===v?' active':'');b.style.background=v;b.onclick=()=>{state.color=v;[...ce.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()};ce.appendChild(b)});
makeChips('expressions',expressions,'expression');makeChips('headwear',headwear,'headwear');makeChips('accessories',accessories,'accessory');makeChips('roles',roles,'role');makeChips('backgrounds',Object.keys(bgs),'bg');
document.getElementById('nickname').addEventListener('input',e=>{state.nickname=e.target.value;draw()});
document.getElementById('randomBtn').onclick=()=>{state.color=colors[Math.floor(Math.random()*colors.length)];state.expression=expressions[Math.floor(Math.random()*expressions.length)];state.headwear=headwear[Math.floor(Math.random()*headwear.length)];state.accessory=accessories[Math.floor(Math.random()*accessories.length)];state.role=roles[Math.floor(Math.random()*roles.length)];state.bg=Object.keys(bgs)[Math.floor(Math.random()*Object.keys(bgs).length)];rebuildUI();draw()};
function rebuildUI(){document.querySelectorAll('.chip,.swatch').forEach(x=>x.classList.remove('active'));[...document.getElementById('colors').children].forEach((x,i)=>{if(colors[i]===state.color)x.classList.add('active')});[['expressions','expression'],['headwear','headwear'],['accessories','accessory'],['roles','role'],['backgrounds','bg']].forEach(([id,key])=>[...document.getElementById(id).children].forEach(x=>{if(x.textContent===state[key])x.classList.add('active')}))}
function save(transparent,name){draw(transparent);let a=document.createElement('a');a.download=name;a.href=canvas.toDataURL('image/png');a.click();draw(false)}
document.getElementById('downloadBtn').onclick=()=>save(false,'my-stabi-card.png');document.getElementById('transparentBtn').onclick=()=>save(true,'my-stabi-avatar.png');draw();
</script>
</body>
</html>
